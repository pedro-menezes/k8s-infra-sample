name: Application

on:
  push:
    branches:
      - stage
      - main
    paths:
      - 'app/**'

env:
  IMAGE_NAME: sample-app

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # - name: Push to ACR
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ${{ secrets.ACR_LOGIN_SERVER }}
      #     username: ${{ secrets.ACR_USERNAME }}
      #     password: ${{ secrets.ACR_PASSWORD }}
      #
      # - name: Push
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: ./app
      #     file: ./app/Dockerfile
      #     push: true
      #     tags: ${{ steps.meta.outputs.tags }}
      #     labels: ${{ steps.meta.outputs.labels }}

      - name: Update image tag in manifests
        if: github.event_name == 'push'
        run: |
          SHA_TAG=$(echo "${{ steps.meta.outputs.tags }}" | grep sha | head -n1)
          ENV=$([[ "${{ github.ref }}" == "refs/heads/main" ]] && echo "production" || echo "staging")

          sed -i "s|image: .*|image: ${SHA_TAG}|g" \
            manifests/apps/${ENV}/sample/deployment.yaml

      - name: Commit updated manifests
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add manifests/
          git diff --staged --quiet || git commit -m "chore: update image tag [skip ci]"
          git push origin ${{ github.ref_name }}