apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/pedro-menezes/k8s-infra
    targetRevision: main
    path: manifests/apps/production/sample
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-app
  syncPolicy:
    syncOptions:
      - CreateNamespace=true